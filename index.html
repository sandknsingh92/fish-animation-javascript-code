
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Underwater Fish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="aquarium">

        <div class="sunlight"></div>

        <div class="heading">
            <h1>Underwater World</h1>
            <p>A Beautiful Ocean Adventure 🐠</p>
        </div>

        <!-- Bubbles -->
        <div class="bubbles" id="bubbles"></div>

        <!-- Sea plants -->
        <div class="plants">
            <div class="plant plant1"></div>
            <div class="plant plant2"></div>
            <div class="plant plant3"></div>
            <div class="plant plant4"></div>
        </div>

        <!-- Fish -->
        <div class="fish" id="fish">
            <div class="tail"></div>
            <div class="fish-body">
                <div class="stripe stripe1"></div>
                <div class="stripe stripe2"></div>
                <div class="eye"></div>
                <div class="mouth"></div>
                <div class="fin"></div>
            </div>
        </div>

        <!-- Small fish -->
        <div class="small-fish">
            <div class="small-tail"></div>
            <div class="small-body">
                <div class="small-eye"></div>
            </div>
        </div>

        <!-- Sea floor -->
        <div class="sea-floor">
            <div class="sand"></div>
            <div class="rock rock1"></div>
            <div class="rock rock2"></div>
            <div class="rock rock3"></div>
        </div>

        <div class="footer-text">Welcome to the Ocean 🌊</div>

    </div>

    <script src="index.js"></script>
</body>
</html>
